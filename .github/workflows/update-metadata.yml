name: Update App Metadata

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - quick

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Set run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%H)" = "02" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=quick" >> $GITHUB_OUTPUT
          fi

      # Quick run needs the existing source page files from gh-pages
      # (refresh_index.py reads data/sources/ to rebuild index.json)
      # Full run skips this — it fetches everything fresh from the APIs
      - name: Restore data from gh-pages (quick run only)
        if: steps.mode.outputs.mode == 'quick'
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout origin/gh-pages -- data 2>/dev/null || echo "No data on gh-pages yet, quick run will be skipped"
          else
            echo "gh-pages branch does not exist yet"
          fi

      - name: Run metadata fetcher (full)
        if: steps.mode.outputs.mode == 'full'
        env:
          GITLAB_TOKEN:   ${{ secrets.GITLAB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          RUN_MODE: full
        run: python scripts/fetch_metadata.py

      - name: Run metadata fetcher (quick)
        if: steps.mode.outputs.mode == 'quick'
        env:
          GITLAB_TOKEN:   ${{ secrets.GITLAB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          RUN_MODE: quick
        run: |
          if [ -d "data/sources" ]; then
            python scripts/refresh_index.py
          else
            echo "No cached source data found — skipping quick run (waiting for first full run)"
          fi

      - name: Fetch GitHub release data
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -d "data" ]; then
            python scripts/fetch_releases.py
          else
            echo "No data directory yet — skipping GitHub release fetch"
          fi

      - name: Commit and push to gh-pages
        run: |
          if [ ! -d "data" ]; then
            echo "No data directory — nothing to deploy, exiting cleanly"
            exit 0
          fi

          mkdir _deploy
          cp -r data _deploy/data
          cp announcement.json _deploy/announcement.json
          # Hero pins. Deployed from main like announcement.json — this job
          # force-pushes a freshly built tree, so anything not copied here is
          # erased from gh-pages on the next run. Tolerates the file being absent
          # so removing a promotion is just deleting it on main.
          cp featured.json _deploy/featured.json 2>/dev/null || true

          cd _deploy

          git init
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "chore: refresh metadata $(date -u +%Y-%m-%dT%H:%M:%SZ) [${{ steps.mode.outputs.mode }}]"

          git push --force \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            HEAD:gh-pages

name: Update App Metadata

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - quick

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Set run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%H)" = "02" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=quick" >> $GITHUB_OUTPUT
          fi

      - name: Run metadata fetcher (full)
        if: steps.mode.outputs.mode == 'full'
        env:
          GITLAB_TOKEN:   ${{ secrets.GITLAB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          RUN_MODE: full
        run: python scripts/fetch_metadata.py

      - name: Run metadata fetcher (quick)
        if: steps.mode.outputs.mode == 'quick'
        env:
          GITLAB_TOKEN:   ${{ secrets.GITLAB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          RUN_MODE: quick
        run: python scripts/refresh_index.py

      - name: Commit and push to gh-pages
        run: |
          # Wrap data/ inside a deploy folder so gh-pages serves it at /data/
          # The client fetches {cdnBase}/data/index.json — this keeps the path correct
          mkdir _deploy
          cp -r data _deploy/data

          cd _deploy

          git init
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "chore: refresh metadata $(date -u +%Y-%m-%dT%H:%M:%SZ) [${{ steps.mode.outputs.mode }}]"

          git push --force \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            HEAD:gh-pages

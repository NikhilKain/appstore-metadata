name: Update App Metadata

on:
  schedule:
    # Full re-discovery once per day at 2 AM UTC
    # (fetches all sources, rebuilds everything — takes 60-120 min)
    - cron: "0 2 * * *"

    # Quick index refresh every hour
    # (only refreshes index.json + detail files for top apps — takes < 5 min)
    - cron: "0 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "full"
        type: choice
        options:
          - full       # full re-discovery from all sources
          - quick      # index refresh only (reads cached page files)

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 180    # full run can take up to 2 hours

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Determine whether this is a full run or quick run.
      # Manual triggers use the input. Scheduled triggers:
      #   - 2 AM UTC cron  → full
      #   - every other hour → quick
      - name: Set run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%H)" = "02" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=quick" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # Full run — re-discovers all apps from every source
      # Tokens used:
      #   GITLAB_TOKEN   — optional, raises GitLab API rate limits
      #   CODEBERG_TOKEN — optional, raises Codeberg API rate limits
      #   (F-Droid, Flathub, Winget need no tokens — fully public APIs)
      # -----------------------------------------------------------------------
      - name: Run metadata fetcher (full)
        if: steps.mode.outputs.mode == 'full'
        env:
          GITLAB_TOKEN:   ${{ secrets.GITLAB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          RUN_MODE: full
        run: python scripts/fetch_metadata.py

      # -----------------------------------------------------------------------
      # Quick run — rebuilds index from cached page files only
      # (no external API calls except for stale detail files)
      # -----------------------------------------------------------------------
      - name: Run metadata fetcher (quick — index refresh only)
        if: steps.mode.outputs.mode == 'quick'
        env:
          GITLAB_TOKEN:   ${{ secrets.GITLAB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          RUN_MODE: quick
        run: python scripts/refresh_index.py

      # -----------------------------------------------------------------------
      # Push output to gh-pages as an orphan commit (no history bloat).
      # Each deploy replaces the previous commit entirely — the branch always
      # has exactly 1 commit, keeping the repo size small forever.
      # -----------------------------------------------------------------------
      - name: Commit and push to gh-pages
        run: |
          cd data

          git init
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "chore: refresh metadata $(date -u +%Y-%m-%dT%H:%M:%SZ) [${{ steps.mode.outputs.mode }}]"

          git push --force \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            HEAD:gh-pages
